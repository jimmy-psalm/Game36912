<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3-6-9-12 連線棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    touch-action: manipulation;
}
body {
    background: #f0e8d8;
    font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    overflow: auto;
}
.game-container {
    background: #e8dcc8;
    border-radius: 16px;
    padding: 12px 16px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 98vw;
}
h1 {
    font-size: 20px;
    color: #3d2b1a;
    margin-bottom: 4px;
    letter-spacing: 2px;
}
.status-bar {
    font-size: 13px;
    color: #5a4030;
    margin-bottom: 6px;
    min-height: 20px;
    line-height: 20px;
}
.board-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
}
canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    background: #f5e6cc;
    box-shadow: inset 0 0 0 1px #b8a080;
    touch-action: manipulation;
}
.score-area {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 8px;
    margin-top: 6px;
}
.score-panel {
    display: flex;
    gap: 6px;
    flex: 1;
    max-width: 300px;
}
.score-card {
    background: #f5ede0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    flex: 1;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    min-height: 70px;
}
.score-card .card-banner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 36px;
    min-width: 36px;
    padding: 4px 0;
    font-size: 14px;
    font-weight: bold;
    color: white;
    line-height: 1.3;
}
.score-card .card-banner.human-banner {
    background: #ff6b6b;
}
.score-card .card-banner.ai-banner {
    background: #4ecdc4;
}
.score-card .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 4px 8px;
}
.score-card .score-value {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.1;
    transition: font-size 0.3s;
}
.score-card .score-value.human { color: #ff6b6b; }
.score-card .score-value.ai { color: #4ecdc4; }
.score-card .score-value.small {
    font-size: 14px;
}
.score-card .score-label {
    font-size: 10px;
    color: #8a7a6a;
    line-height: 1;
}
.score-card .result-text {
    display: none;
    font-size: 28px;
    font-weight: bold;
    line-height: 1.1;
    margin-top: 2px;
}
.score-card .result-text.show {
    display: block;
}
.score-card .result-text.win { color: #2ecc71; }
.score-card .result-text.loss { color: #e74c3c; }
.score-card .result-text.draw { color: #f39c12; }
.zoom-stack {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.zoom-stack button {
    flex: 1;
    min-width: 36px;
    padding: 2px 10px !important;
    font-size: 16px !important;
}
.info-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
}
.btn-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.btn-group {
    display: inline-flex;
    gap: 2px;
}
.group-btn {
    background: #b8a888;
    color: #3d2b1a;
    font-size: 16px !important;
    font-weight: bold;
    padding: 5px 12px !important;
    min-width: 36px;
    height: 44px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.group-btn:hover { background: #a89878; }
.group-btn:active { background: #988868; }
.group-btn.error-flash {
    background: #dc2020 !important;
    transition: background 0s;
}
.info-panel button {
    font-size: 16px;
    font-weight: bold;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
}
.copy-btn {
    background: #5a8ab5;
    color: white;
}
.copy-btn:hover { background: #4a7aa5; }
.copy-btn:active { background: #3a6a95; }
.copy-btn:disabled { background: #c0b0a0; cursor: default; }

.load-btn {
    background: #7a9a6a;
    color: white;
}
.load-btn:hover { background: #6a8a5a; }
.load-btn:active { background: #5a7a4a; }
.load-btn.error-flash {
    background: #dc2020 !important;
    transition: background 0s;
}

.size-btn {
    background: #8a7a6a;
    color: white;
    font-size: 16px !important;
    font-weight: bold;
    padding: 5px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    min-width: 48px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.size-btn:hover { background: #7a6a5a; }
.size-btn:active { background: #6a5a4a; }
.size-btn:disabled { background: #c0b0a0; cursor: default; }

.mode-toggle-btn {
    background: #5a8ab5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 5px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    min-width: 48px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.mode-toggle-btn:hover { opacity: 0.85; }
.mode-toggle-btn:active { opacity: 0.7; }

.start-btn {
    background: #c8b498;
    color: #3d2b1a;
}
.start-btn:hover { background: #b8a488; }
.start-btn:active { background: #a89478; }

.turn-indicator {
    font-size: 12px;
    color: #6a5040;
    margin-top: 4px;
}

@media (orientation: portrait) {
    .board-wrapper {
        flex-direction: column;
        align-items: center;
    }
    .score-panel {
        flex-direction: row;
        width: 100%;
        max-width: 500px;
    }
}

@media (orientation: landscape) {
    .board-wrapper {
        flex-direction: row;
        align-items: flex-start;
    }
    .score-panel {
        flex-direction: column;
        min-width: 100px;
    }
}
</style>
</head>
<body>
<div class="game-container">
    <h1>3-6-9-12</h1>
    <div class="status-bar" id="statusBar">人類先手 (珊瑚紅) — 請點擊棋盤下子</div>
    <div class="board-wrapper">
        <canvas id="boardCanvas"></canvas>
    </div>
    <div class="score-area">
        <div class="score-panel" id="scorePanel">
            <div class="score-card">
                <div class="card-banner human-banner">人<br>類</div>
                <div class="card-content">
                    <div class="score-value human" id="humanScore">0</div>
                    <div class="score-label">分</div>
                    <div class="result-text" id="humanResult"></div>
                </div>
            </div>
            <div class="score-card">
                <div class="card-banner ai-banner">電<br>腦</div>
                <div class="card-content">
                    <div class="score-value ai" id="aiScore">0</div>
                    <div class="score-label">分</div>
                    <div class="result-text" id="aiResult"></div>
                </div>
            </div>
        </div>
        <div class="zoom-stack">
            <button class="group-btn" id="zoomInBtn">+</button>
            <button class="group-btn" id="zoomOutBtn">−</button>
        </div>
    </div>
    <div class="info-panel">
        <div class="btn-row">
            <button class="copy-btn" id="copyBtn">複製記錄</button>
            <button class="load-btn" id="loadBtn">載入</button>
            <div class="btn-group">
                <button class="group-btn" id="backBtn">←</button>
                <button class="group-btn" id="forwardBtn">→</button>
            </div>
            <button class="size-btn" id="sizeBtn">12x12</button>
            <button class="mode-toggle-btn" id="modeToggleBtn">基礎</button>
            <button class="start-btn" id="resetBtn">開始</button>
        </div>
    </div>
    <div class="turn-indicator" id="turnIndicator">● 輪到人類</div>
</div>

<script>
// ============================================================
//  3-6-9-12 連線棋 (人機對戰版) — HTML5 Canvas
// ============================================================

// ---- Constants ----
let SIZE = 12;
const EMPTY = 0, HUMAN = 1, AI = 2;
const VALID_LENGTHS = [3, 6, 9, 12];

// Colors (Plan E)
const COLOR_BOARD = '#f5e6cc';
const COLOR_HUMAN = '#ff6b6b';
const COLOR_AI = '#4ecdc4';
const COLOR_HUMAN_LINE = '#ff6b6b';
const COLOR_AI_LINE = '#4ecdc4';

// ---- Canvas setup ----
let CELL = 48;
let PAD = 20;
let RADIUS = 20;
let zoomLevel = 1.0;

const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');

// ---- DOM refs ----
const statusBar = document.getElementById('statusBar');
const humanScoreSpan = document.getElementById('humanScore');
const aiScoreSpan = document.getElementById('aiScore');
const turnIndicator = document.getElementById('turnIndicator');
const copyBtn = document.getElementById('copyBtn');
const backBtn = document.getElementById('backBtn');
const forwardBtn = document.getElementById('forwardBtn');

// ---- Game state ----
let grid = [];
let redLines = [];
let humanScore = 0;
let aiScore = 0;
let currentPlayer = HUMAN;
let gameOver = false;
let extraTurn = false;
let aiThinking = false;
let lastMoveR = -1, lastMoveC = -1;

// ---- Mode: 'basic' (show hints) or 'advance' (no hints) ----
let gameMode = 'basic';
const modeToggleBtn = document.getElementById('modeToggleBtn');

function toggleMode() {
    if (gameMode === 'basic') {
        gameMode = 'advance';
        modeToggleBtn.textContent = '進階';
        modeToggleBtn.style.background = '#5a8ab5';
    } else {
        gameMode = 'basic';
        modeToggleBtn.textContent = '基礎';
        modeToggleBtn.style.background = '#5a8ab5';
    }
    drawBoard();
}

modeToggleBtn.addEventListener('click', toggleMode);

// ---- Move history ----
let moveHistory = [];
let moveNumber = 0;
let gameStopped = false;

// ---- Snapshots for forward/backward navigation ----
let snapshots = [];
let forwardSnapshots = [];

function takeSnapshot() {
    snapshots.push({
        grid: grid.map(row => [...row]),
        redLines: redLines.map(l => ({...l})),
        humanScore: humanScore,
        aiScore: aiScore,
        currentPlayer: currentPlayer,
        gameOver: gameOver,
        extraTurn: extraTurn,
        lastMoveR: lastMoveR,
        lastMoveC: lastMoveC,
        moveHistory: [...moveHistory],
        moveNumber: moveNumber
    });
}

function restoreSnapshot(snap) {
    grid = snap.grid.map(row => [...row]);
    redLines = snap.redLines.map(l => ({...l}));
    humanScore = snap.humanScore;
    aiScore = snap.aiScore;
    currentPlayer = snap.currentPlayer;
    gameOver = snap.gameOver;
    extraTurn = snap.extraTurn;
    lastMoveR = snap.lastMoveR;
    lastMoveC = snap.lastMoveC;
    moveHistory = [...snap.moveHistory];
    moveNumber = snap.moveNumber;
}

// ---- Move history functions ----
function recordMove(row, col, player) {
    moveNumber++;
    const playerChar = player === HUMAN ? 'h' : 'a';
    const entry = padNumber(moveNumber, 3) + playerChar + '(' + row + ',' + col + ')';
    moveHistory.push(entry);
}

function padNumber(num, len) {
    return String(num).padStart(len, '0');
}

function copyHistory() {
    if (moveHistory.length === 0) {
        setStatus('⚠️ 暫無移動記錄');
        return;
    }
    const text = moveHistory.join(', ');
    navigator.clipboard.writeText(text).then(() => {
        setStatus('✅ 已複製 ' + moveHistory.length + ' 步移動記錄到剪貼板');
        console.log('=== 移動記錄 ===');
        console.log(text);
        console.log('人類得分:', humanScore, 'AI得分:', aiScore);
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setStatus('✅ 已複製 ' + moveHistory.length + ' 步移動記錄到剪貼板');
        console.log('=== 移動記錄 ===');
        console.log(text);
        console.log('人類得分:', humanScore, 'AI得分:', aiScore);
    });
}

copyBtn.addEventListener('click', copyHistory);

// ---- Load from clipboard ----
const loadBtn = document.getElementById('loadBtn');

function loadFromClipboard() {
    navigator.clipboard.readText().then(text => {
        text = text.trim();
        if (!text) {
            flashLoadButton();
            setStatus('⚠️ 剪貼簿為空，無法載入');
            return;
        }
        
        // Parse the move history format: "001h(0,0), 002a(1,1), 003h(2,2)..."
        const moveRegex = /(\d{3}[ha]\(\d+,\d+\))/g;
        const matches = text.match(moveRegex);
        
        if (!matches || matches.length === 0) {
            flashLoadButton();
            setStatus('⚠️ 剪貼簿內容格式不正確，無法載入');
            return;
        }
        
        // Reset the game first
        if (aiTimer) {
            clearTimeout(aiTimer);
            aiTimer = null;
        }
        aiThinking = false;
        initGrid();
        redLines = [];
        humanScore = 0;
        aiScore = 0;
        currentPlayer = HUMAN;
        gameOver = false;
        extraTurn = false;
        lastMoveR = -1;
        lastMoveC = -1;
        moveHistory = [];
        moveNumber = 0;
        snapshots = [];
        forwardSnapshots = [];
        
        // Parse and replay each move
        let success = true;
        for (let i = 0; i < matches.length; i++) {
            const entry = matches[i];
            const playerChar = entry.charAt(3);
            const coords = entry.substring(5, entry.length - 1);
            const parts = coords.split(',');
            const r = parseInt(parts[0]);
            const c = parseInt(parts[1]);
            const player = playerChar === 'h' ? HUMAN : AI;
            
            if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || !isEmpty(r, c)) {
                success = false;
                break;
            }
            
            // Take snapshot before each move
            takeSnapshot();
            
            lastMoveR = r;
            lastMoveC = c;
            
            const result = processMove(r, c, player);
            if (!result.valid) {
                success = false;
                break;
            }
            
            recordMove(r, c, player);
        }
        
        if (!success) {
            // If loading failed, reset everything
            flashLoadButton();
            resetGame();
            setStatus('⚠️ 載入失敗，記錄格式有誤');
            return;
        }
        
        // After loading all moves, ensure it's human's turn
        // If the last move was by AI, switch to human
        if (currentPlayer === AI) {
            currentPlayer = HUMAN;
        }
        extraTurn = false;
        
        updateUI();
        updateTurnIndicator();
        setStatus('✅ 已載入 ' + matches.length + ' 步記錄，請使用 ← → 回放');
        autoCopyHistory();
    }).catch(() => {
        flashLoadButton();
        setStatus('⚠️ 無法讀取剪貼簿');
    });
}

function flashLoadButton() {
    loadBtn.classList.add('error-flash');
    setTimeout(() => {
        loadBtn.classList.remove('error-flash');
    }, 500);
}

loadBtn.addEventListener('click', loadFromClipboard);

// ---- Auto-fit board to screen size ----
function autoFitBoard() {
    const isLandscape = window.innerWidth > window.innerHeight;
    let availableWidth;

    if (isLandscape) {
        availableWidth = window.innerWidth - 140;
    } else {
        availableWidth = window.innerWidth - 20;
    }

    availableWidth -= 32;

    const maxCell = Math.floor((availableWidth - 40) / SIZE);
    const clampedCell = Math.max(20, Math.min(48, maxCell));

    zoomLevel = clampedCell / 48;
    CELL = clampedCell;
    PAD = Math.round(20 * zoomLevel);
    RADIUS = Math.round(20 * zoomLevel);
    canvas.width = PAD * 2 + CELL * SIZE;
    canvas.height = PAD * 2 + CELL * SIZE;

    drawBoard();
}

function resizeBoard(factor) {
    const newZoom = zoomLevel * factor;
    if (newZoom < 0.3 || newZoom > 3.0) return;
    zoomLevel = newZoom;
    CELL = Math.round(48 * zoomLevel);
    PAD = Math.round(20 * zoomLevel);
    RADIUS = Math.round(20 * zoomLevel);
    canvas.width = PAD * 2 + CELL * SIZE;
    canvas.height = PAD * 2 + CELL * SIZE;
    drawBoard();
}

document.getElementById('zoomInBtn').addEventListener('click', () => resizeBoard(1.1));
document.getElementById('zoomOutBtn').addEventListener('click', () => resizeBoard(1 / 1.1));

// ---- Board size cycling (12x12 → 9x9 → 6x6 → 12x12) ----
const sizeBtn = document.getElementById('sizeBtn');
const sizeOptions = ['12x12', '9x9', '6x6'];
let sizeIndex = 0;

function changeBoardSize() {
    // Disable during active game (pieces placed but game not over)
    if (moveHistory.length > 0 && !gameOver) {
        sizeBtn.classList.add('error-flash');
        setTimeout(() => sizeBtn.classList.remove('error-flash'), 500);
        setStatus('⚠️ 遊戲進行中無法切換棋盤大小，請先重置');
        return;
    }
    
    sizeIndex = (sizeIndex + 1) % sizeOptions.length;
    const newSizeLabel = sizeOptions[sizeIndex];
    sizeBtn.textContent = newSizeLabel;
    
    // Update SIZE based on button label
    if (newSizeLabel === '12x12') SIZE = 12;
    else if (newSizeLabel === '9x9') SIZE = 9;
    else if (newSizeLabel === '6x6') SIZE = 6;
    
    // Reset game with new size
    resetGame();
    autoFitBoard();
    setStatus('棋盤已切換為 ' + SIZE + 'x' + SIZE + ' (' + newSizeLabel + ')');
}

sizeBtn.addEventListener('click', changeBoardSize);

// ---- Global double-click prevention ----
document.addEventListener('dblclick', (e) => e.preventDefault());

// ---- Board functions ----
function initGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < SIZE; c++) {
            grid[r][c] = EMPTY;
        }
    }
}

function getCell(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return -1;
    return grid[r][c];
}

function isEmpty(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE && grid[r][c] === EMPTY;
}

function placePiece(r, c, player) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
    if (grid[r][c] !== EMPTY) return false;
    grid[r][c] = player;
    return true;
}

function isBoardFull() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) return false;
        }
    }
    return true;
}

// ---- RedLine management ----
function addRedLine(row, col, horizontal, length, owner) {
    redLines = redLines.filter(existing => {
        if (existing.horizontal !== horizontal) return true;
        if (horizontal) {
            if (existing.row !== row) return true;
            const eStart = existing.col;
            const eEnd = existing.col + existing.length - 1;
            const nStart = col;
            const nEnd = col + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        } else {
            if (existing.col !== col) return true;
            const eStart = existing.row;
            const eEnd = existing.row + existing.length - 1;
            const nStart = row;
            const nEnd = row + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        }
    });
    redLines.push({ row, col, horizontal, length, owner });
}

// ---- Line detection ----
function countConsecutiveOccupied(row, col, horizontal) {
    let count = 1;
    if (horizontal) {
        for (let c = col - 1; c >= 0; c--) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
        for (let c = col + 1; c < SIZE; c++) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
    } else {
        for (let r = row - 1; r >= 0; r--) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
        for (let r = row + 1; r < SIZE; r++) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
    }
    return count;
}

function findHorizontalStart(row, col) {
    let start = col;
    for (let c = col - 1; c >= 0; c--) {
        if (getCell(row, c) !== EMPTY) start = c; else break;
    }
    return start;
}

function findVerticalStart(row, col) {
    let start = row;
    for (let r = row - 1; r >= 0; r--) {
        if (getCell(r, col) !== EMPTY) start = r; else break;
    }
    return start;
}

function checkAllLines(row, col) {
    const results = [];
    const hCount = countConsecutiveOccupied(row, col, true);
    for (const len of VALID_LENGTHS) {
        if (hCount === len) {
            const startCol = findHorizontalStart(row, col);
            results.push({ startRow: row, startCol, endRow: row, endCol: startCol + len - 1, horizontal: true, length: len, score: len });
        }
    }
    const vCount = countConsecutiveOccupied(row, col, false);
    for (const len of VALID_LENGTHS) {
        if (vCount === len) {
            const startRow = findVerticalStart(row, col);
            results.push({ startRow, startCol: col, endRow: startRow + len - 1, endCol: col, horizontal: false, length: len, score: len });
        }
    }
    return results;
}

// ---- Process a move ----
function processMove(row, col, player) {
    const result = { valid: false, scored: false, score: 0, redLine: null, gameEnded: false };

    if (!placePiece(row, col, player)) {
        return result;
    }
    result.valid = true;

    const scoredLines = checkAllLines(row, col);

    if (scoredLines.length > 0) {
        let bestLine = scoredLines[0];
        for (const line of scoredLines) {
            if (line.score > bestLine.score) bestLine = line;
        }

        if (player === HUMAN) {
            humanScore += bestLine.score;
        } else {
            aiScore += bestLine.score;
        }

        addRedLine(bestLine.startRow, bestLine.startCol, bestLine.horizontal, bestLine.length, player);

        result.scored = true;
        result.score = bestLine.score;
        result.redLine = { row: bestLine.startRow, col: bestLine.startCol, horizontal: bestLine.horizontal, length: bestLine.length, owner: player };

        extraTurn = true;
    } else {
        extraTurn = false;
    }

    if (isBoardFull()) {
        gameOver = true;
        result.gameEnded = true;
    }

    return result;
}

// ---- AI ----
function getAllEmptyCells() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) empty.push([r, c]);
        }
    }
    return empty;
}

function evaluateScorePotential(row, col) {
    grid[row][col] = AI;
    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;
    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;
    grid[row][col] = EMPTY;
    return score;
}

function evaluateBlockPotential(row, col) {
    grid[row][col] = HUMAN;
    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;
    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;
    grid[row][col] = EMPTY;
    return score;
}

function evaluateDangerPotential(row, col) {
    grid[row][col] = AI;
    let maxHumanScore = 0;
    
    for (let c = 0; c < SIZE; c++) {
        if (grid[row][c] !== EMPTY) continue;
        grid[row][c] = HUMAN;
        const hCount = countConsecutiveOccupied(row, c, true);
        const vCount = countConsecutiveOccupied(row, c, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[row][c] = EMPTY;
        if (score > maxHumanScore) maxHumanScore = score;
    }
    
    for (let r = 0; r < SIZE; r++) {
        if (grid[r][col] !== EMPTY) continue;
        grid[r][col] = HUMAN;
        const hCount = countConsecutiveOccupied(r, col, true);
        const vCount = countConsecutiveOccupied(r, col, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[r][col] = EMPTY;
        if (score > maxHumanScore) maxHumanScore = score;
    }
    
    grid[row][col] = EMPTY;
    return maxHumanScore;
}

function evaluateAIChainPotential(row, col) {
    grid[row][col] = AI;
    const totalScore = simulateChain(row, col, AI);
    grid[row][col] = EMPTY;
    return totalScore;
}

function simulateChain(pr, pc, player, depth) {
    if (depth === undefined) depth = 0;
    if (depth >= 6) return 0;

    let bestScore = 0;
    let bestR = -1, bestC = -1;

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] !== EMPTY) continue;
            grid[r][c] = player;
            const hCount = countConsecutiveOccupied(r, c, true);
            const vCount = countConsecutiveOccupied(r, c, false);
            let score = 0;
            if (hCount === 12) score = 12;
            else if (hCount === 9) score = 9;
            else if (hCount === 6) score = 6;
            else if (hCount === 3) score = 3;
            if (vCount === 12) score = Math.max(score, 12);
            else if (vCount === 9) score = Math.max(score, 9);
            else if (vCount === 6) score = Math.max(score, 6);
            else if (vCount === 3) score = Math.max(score, 3);
            grid[r][c] = EMPTY;
            if (score > bestScore) {
                bestScore = score;
                bestR = r;
                bestC = c;
            }
        }
    }

    if (bestScore === 0) return 0;

    grid[bestR][bestC] = player;
    const chainScore = simulateChain(bestR, bestC, player, depth + 1);
    grid[bestR][bestC] = EMPTY;

    return bestScore + chainScore;
}

function getBestAIMove() {
    const emptyCells = getAllEmptyCells();
    if (emptyCells.length === 0) return null;
    let bestScore = -Infinity;
    let bestMoves = [];
    for (const cell of emptyCells) {
        const row = cell[0], col = cell[1];
        let score = 0;
        const immediateScore = evaluateScorePotential(row, col);
        score += immediateScore * 100;
        let aiChain = 0;
        if (immediateScore > 0) {
            aiChain = evaluateAIChainPotential(row, col);
            score += aiChain * 100;
        }
        score += evaluateBlockPotential(row, col) * 50;
        const centerDist = Math.abs(row - SIZE / 2) + Math.abs(col - SIZE / 2);
        score += (SIZE - centerDist);
        score -= evaluateDangerPotential(row, col) * 200;
        if (score > bestScore) {
            bestScore = score;
            bestMoves = [[row, col]];
        } else if (score === bestScore) {
            bestMoves.push([row, col]);
        }
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// ---- Find human scoring hints ----
function getHumanScoringHints() {
    const hints = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] !== EMPTY) continue;
            grid[r][c] = HUMAN;
            const hCount = countConsecutiveOccupied(r, c, true);
            const vCount = countConsecutiveOccupied(r, c, false);
            let canScore = false;
            for (const len of VALID_LENGTHS) {
                if (hCount === len || vCount === len) {
                    canScore = true;
                    break;
                }
            }
            grid[r][c] = EMPTY;
            if (canScore) {
                hints.push([r, c]);
            }
        }
    }
    return hints;
}

// ---- Find positions where AI will have NO chance to gain point ----
// For each empty cell, simulate human placing there, then check if AI
// has ANY move that would score. Return cells where AI cannot score at all.
function getAIMinScoreHints() {
    const emptyCells = getAllEmptyCells();
    if (emptyCells.length === 0) return [];
    
    const safeCells = [];
    
    for (const [r, c] of emptyCells) {
        // Temporarily place human piece here
        grid[r][c] = HUMAN;
        
        // Check if AI has ANY move that would score
        let aiCanScore = false;
        for (const [ar, ac] of getAllEmptyCells()) {
            if (grid[ar][ac] !== EMPTY) continue;
            grid[ar][ac] = AI;
            const hCount = countConsecutiveOccupied(ar, ac, true);
            const vCount = countConsecutiveOccupied(ar, ac, false);
            let canScore = false;
            for (const len of VALID_LENGTHS) {
                if (hCount === len || vCount === len) {
                    canScore = true;
                    break;
                }
            }
            grid[ar][ac] = EMPTY;
            if (canScore) {
                aiCanScore = true;
                break;
            }
        }
        
        grid[r][c] = EMPTY;
        
        // If AI cannot score at all, this is a safe cell
        if (!aiCanScore) {
            safeCells.push([r, c]);
        }
    }
    
    return safeCells;
}

// ---- Drawing ----
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = COLOR_BOARD;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#8a7a6a';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= SIZE; i++) {
        const x = PAD + i * CELL;
        const y = PAD + i * CELL;
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(PAD + SIZE * CELL, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, PAD + SIZE * CELL);
        ctx.stroke();
    }

    const fontSize = Math.max(10, Math.round(RADIUS * 0.9));

    // Draw score lines FIRST (behind pieces) so they don't cross numbers inside circles
    // Thickness doubled from 2.0 to 4.0
    for (const line of redLines) {
        const color = line.owner === HUMAN ? COLOR_HUMAN_LINE : COLOR_AI_LINE;
        ctx.strokeStyle = color;
        ctx.lineWidth = 4.0;

        if (line.horizontal) {
            const y = PAD + line.row * CELL + CELL / 2;
            const x1 = PAD + line.col * CELL + CELL / 2;
            const x2 = PAD + (line.col + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.stroke();
        } else {
            const x = PAD + line.col * CELL + CELL / 2;
            const y1 = PAD + line.row * CELL + CELL / 2;
            const y2 = PAD + (line.row + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
            ctx.stroke();
        }
    }

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (cell !== EMPTY) {
                const cx = PAD + c * CELL + CELL / 2;
                const cy = PAD + r * CELL + CELL / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = cell === HUMAN ? COLOR_HUMAN : COLOR_AI;
                ctx.fill();
                const isLastMove = (r === lastMoveR && c === lastMoveC);
                if (isLastMove) {
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 3.5;
                } else {
                    ctx.strokeStyle = '#3a2a1a';
                    ctx.lineWidth = 1.5;
                }
                ctx.stroke();

                const moveIdx = moveHistory.findIndex(entry => {
                    const parts = entry.split(/[h,a]\(/);
                    if (parts.length < 2) return false;
                    const coords = parts[1].replace(')', '');
                    const [mr, mc] = coords.split(',').map(Number);
                    return mr === r && mc === c;
                });
                if (moveIdx !== -1) {
                    const num = moveIdx + 1;
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, cx, cy);
                }
            }
        }
    }

    // Draw hints only in 'basic' mode
    if (currentPlayer === HUMAN && !gameOver && !aiThinking && gameMode === 'basic') {
        // Golden dotted circles: positions where human can score
        const scoreHints = getHumanScoringHints();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#ffaa00';
        for (const [r, c] of scoreHints) {
            const cx = PAD + c * CELL + CELL / 2;
            const cy = PAD + r * CELL + CELL / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, RADIUS + 4, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Blue dotted circles: positions where AI cannot score (exclude golden hint positions)
        const aiMinHints = getAIMinScoreHints();
        // Filter out positions that are already golden hints (human can score there)
        const scoreHintSet = new Set(scoreHints.map(([r, c]) => r + ',' + c));
        const filteredBlueHints = aiMinHints.filter(([r, c]) => !scoreHintSet.has(r + ',' + c));
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#4488ff';
        for (const [r, c] of filteredBlueHints) {
            const cx = PAD + c * CELL + CELL / 2;
            const cy = PAD + r * CELL + CELL / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, RADIUS + 4, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        ctx.setLineDash([]);
    }
}

// ---- Auto-copy to clipboard when human's turn ----
function autoCopyHistory() {
    if (moveHistory.length === 0) return;
    const text = moveHistory.join(', ');
    navigator.clipboard.writeText(text).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
    });
}

// ---- Forward/Backward navigation ----
function goBack() {
    if (snapshots.length === 0) {
        flashStepButton(backBtn);
        setStatus('⚠️ 已經是最初狀態，無法後退');
        return;
    }
    
    // Save current state to forwardSnapshots
    forwardSnapshots.push({
        grid: grid.map(row => [...row]),
        redLines: redLines.map(l => ({...l})),
        humanScore: humanScore,
        aiScore: aiScore,
        currentPlayer: currentPlayer,
        gameOver: gameOver,
        extraTurn: extraTurn,
        lastMoveR: lastMoveR,
        lastMoveC: lastMoveC,
        moveHistory: [...moveHistory],
        moveNumber: moveNumber
    });
    
    const targetSnap = snapshots.pop();
    restoreSnapshot(targetSnap);
    
    // Ensure it's human's turn (skip AI steps)
    if (currentPlayer === AI) {
        // Keep going back until we reach human's turn
        while (currentPlayer === AI && snapshots.length > 0) {
            forwardSnapshots.push({
                grid: grid.map(row => [...row]),
                redLines: redLines.map(l => ({...l})),
                humanScore: humanScore,
                aiScore: aiScore,
                currentPlayer: currentPlayer,
                gameOver: gameOver,
                extraTurn: extraTurn,
                lastMoveR: lastMoveR,
                lastMoveC: lastMoveC,
                moveHistory: [...moveHistory],
                moveNumber: moveNumber
            });
            const s = snapshots.pop();
            restoreSnapshot(s);
        }
    }
    
    // If we went back too far and currentPlayer is still AI (no more snapshots), just stay
    if (currentPlayer === AI) {
        // We've exhausted all snapshots, AI is still current - this shouldn't happen normally
        // Just leave it as is
    }
    
    updateUI();
    updateTurnIndicator();
    setStatus('✅ 已後退到第 ' + moveNumber + ' 步，輪到人類');
    autoCopyHistory();
}

function goForward() {
    if (forwardSnapshots.length === 0) {
        flashStepButton(forwardBtn);
        setStatus('⚠️ 已經是最新狀態，無法前進');
        return;
    }
    
    // Save current state to snapshots
    snapshots.push({
        grid: grid.map(row => [...row]),
        redLines: redLines.map(l => ({...l})),
        humanScore: humanScore,
        aiScore: aiScore,
        currentPlayer: currentPlayer,
        gameOver: gameOver,
        extraTurn: extraTurn,
        lastMoveR: lastMoveR,
        lastMoveC: lastMoveC,
        moveHistory: [...moveHistory],
        moveNumber: moveNumber
    });
    
    const targetSnap = forwardSnapshots.pop();
    restoreSnapshot(targetSnap);
    
    // Ensure it's human's turn (skip AI steps)
    if (currentPlayer === AI) {
        while (currentPlayer === AI && forwardSnapshots.length > 0) {
            snapshots.push({
                grid: grid.map(row => [...row]),
                redLines: redLines.map(l => ({...l})),
                humanScore: humanScore,
                aiScore: aiScore,
                currentPlayer: currentPlayer,
                gameOver: gameOver,
                extraTurn: extraTurn,
                lastMoveR: lastMoveR,
                lastMoveC: lastMoveC,
                moveHistory: [...moveHistory],
                moveNumber: moveNumber
            });
            const s = forwardSnapshots.pop();
            restoreSnapshot(s);
        }
    }
    
    if (currentPlayer === AI) {
        // Still AI - exhausted forward snapshots
    }
    
    updateUI();
    updateTurnIndicator();
    setStatus('✅ 已前進到第 ' + moveNumber + ' 步，輪到人類');
    autoCopyHistory();
}

// ---- Long press for repeat action (backward/forward) ----
// Replace click with mousedown/mouseup for reliable repeat
function setupLongPress(btn, action) {
    let timer = null;
    let interval = null;
    let isLongPress = false;
    
    function startRepeat(e) {
        e.preventDefault();
        isLongPress = false;
        action();
        timer = setTimeout(() => {
            isLongPress = true;
            interval = setInterval(action, 150);
        }, 300);
    }
    
    function stopRepeat(e) {
        e.preventDefault();
        if (timer) { clearTimeout(timer); timer = null; }
        if (interval) { clearInterval(interval); interval = null; }
    }
    
    function onClick(e) {
        if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            isLongPress = false;
        }
    }
    
    btn.addEventListener('mousedown', startRepeat);
    btn.addEventListener('mouseup', stopRepeat);
    btn.addEventListener('mouseleave', stopRepeat);
    btn.addEventListener('click', onClick);
    btn.addEventListener('dragstart', (e) => e.preventDefault());
}

// ---- Human move handler ----
let aiTimer = null;

function handleBoardClick(e) {
    if (gameOver) return;
    if (currentPlayer !== HUMAN) return;
    if (aiThinking) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const col = Math.floor((mx - PAD) / CELL);
    const row = Math.floor((my - PAD) / CELL);

    if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
    if (!isEmpty(row, col)) return;

    // Auto-copy history before human moves
    autoCopyHistory();

    // Take snapshot before the move
    takeSnapshot();
    // Clear forward snapshots since we're making a new move
    forwardSnapshots = [];

    lastMoveR = row;
    lastMoveC = col;

    const result = processMove(row, col, HUMAN);
    if (!result.valid) return;

    recordMove(row, col, HUMAN);
    updateUI();
    updateTurnIndicator();

    if (result.gameEnded) {
        showGameOver();
        return;
    }

    if (result.scored) {
        setStatus('人類得分 +' + result.score + '！獲得額外回合！');
    } else {
        setStatus('AI 思考中...');
        currentPlayer = AI;
        updateTurnIndicator();
        startAIMove();
    }
}

canvas.addEventListener('click', handleBoardClick);
// Prevent double-click zoom on canvas
canvas.addEventListener('dblclick', (e) => e.preventDefault());

// ---- AI move ----
function startAIMove() {
    aiThinking = true;
    aiTimer = setTimeout(() => {
        doAIMove();
    }, 500);
}

function doAIMove() {
    if (gameOver) {
        aiThinking = false;
        return;
    }

    const move = getBestAIMove();
    if (!move) {
        aiThinking = false;
        return;
    }

    const row = move[0], col = move[1];

    // Take snapshot before AI move
    takeSnapshot();
    forwardSnapshots = [];

    lastMoveR = row;
    lastMoveC = col;

    const result = processMove(row, col, AI);
    recordMove(row, col, AI);
    updateUI();
    updateTurnIndicator();

    if (result.gameEnded) {
        showGameOver();
        aiThinking = false;
        return;
    }

    if (result.scored) {
        setStatus('AI 得分 +' + result.score + '！AI獲得額外回合！');
        aiTimer = setTimeout(() => {
            doAIMove();
        }, 500);
    } else {
        setStatus('輪到人類 (珊瑚紅) — 請點擊棋盤下子');
        currentPlayer = HUMAN;
        updateTurnIndicator();
        // Set aiThinking to false BEFORE drawing so hints appear immediately
        aiThinking = false;
        // Auto-copy history when it becomes human's turn
        autoCopyHistory();
        // Redraw board immediately to show hints (aiThinking is now false)
        drawBoard();
    }
}

// ---- Game over ----
function showGameOver() {
    setStatus('遊戲結束！');
    updateTurnIndicator();
    
    // Display result in score area instead of alert
    const humanResult = document.getElementById('humanResult');
    const aiResult = document.getElementById('aiResult');
    const humanScoreEl = document.getElementById('humanScore');
    const aiScoreEl = document.getElementById('aiScore');
    
    // Make score values smaller
    humanScoreEl.classList.add('small');
    aiScoreEl.classList.add('small');
    
    if (humanScore > aiScore) {
        // Human wins
        humanResult.textContent = '贏 😊';
        humanResult.className = 'result-text show win';
        aiResult.textContent = '輸 🙁';
        aiResult.className = 'result-text show loss';
    } else if (aiScore > humanScore) {
        // AI wins
        humanResult.textContent = '輸 🙁';
        humanResult.className = 'result-text show loss';
        aiResult.textContent = '贏 😊';
        aiResult.className = 'result-text show win';
    } else {
        // Draw
        humanResult.textContent = '平局';
        humanResult.className = 'result-text show draw';
        aiResult.textContent = '平局';
        aiResult.className = 'result-text show draw';
    }
}

setStatus('人類先手 (珊瑚紅) — 請點擊棋盤下子');

window.addEventListener('resize', autoFitBoard);

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') resetGame();
    if (e.key === 'c' || e.key === 'C') copyHistory();
    if (e.key === 'z' || e.key === 'Z') goBack();
    if (e.key === 'x' || e.key === 'X') goForward();
});

console.log('3-6-9-12 連線棋已啟動');
console.log('快捷鍵: R=重置, C=複製, Z=後退, X=前進');
