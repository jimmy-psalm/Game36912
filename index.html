<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-6-9-12 连线棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0e8d8;
    font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
}
.game-container {
    background: #e8dcc8;
    border-radius: 16px;
    padding: 16px 24px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 900px;

}
h1 {
    font-size: 22px;
    color: #3d2b1a;
    margin-bottom: 4px;
    letter-spacing: 2px;
}
.status-bar {
    font-size: 14px;
    color: #5a4030;
    margin-bottom: 8px;
    min-height: 22px;
    line-height: 22px;
}
.board-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
}
canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    background: #dcc8a8;
    box-shadow: inset 0 0 0 1px #b8a080;
}
.score-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 120px;
    padding-top: 4px;
}
.score-card {
    background: #f5ede0;
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    text-align: left;
}
.score-card .player-name {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 2px;
}
.score-card .player-name.human { color: #2a5db0; }
.score-card .player-name.ai { color: #c07020; }
.score-card .score-value {
    font-size: 28px;
    font-weight: bold;
}
.score-card .score-value.human { color: #2a5db0; }
.score-card .score-value.ai { color: #c07020; }
.score-card .score-label {
    font-size: 12px;
    color: #8a7a6a;
}
.info-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.reset-btn {
    font-size: 14px;
    font-weight: bold;
    padding: 6px 22px;
    border: none;
    border-radius: 8px;
    background: #c8b498;
    color: #3d2b1a;
    cursor: pointer;
    transition: background 0.2s;
}
.reset-btn:hover { background: #b8a488; }
.reset-btn:active { background: #a89478; }
.turn-indicator {
    font-size: 13px;
    color: #6a5040;
    margin-top: 6px;
}
.history-panel {
    margin-top: 10px;
    text-align: left;
    max-height: 160px;
    overflow-y: auto;
    background: #f5ede0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    line-height: 1.6;
    border: 1px solid #d8c8b0;
}
.history-panel .hist-title {
    font-weight: bold;
    color: #3d2b1a;
    margin-bottom: 4px;
    font-family: 'Microsoft YaHei', Arial, sans-serif;
}
.history-panel .hist-entry {
    color: #5a4030;
}
.history-panel .hist-entry.human { color: #2a5db0; }
.history-panel .hist-entry.ai { color: #c07020; }
.stop-btn {
    font-size: 13px;
    font-weight: bold;
    padding: 5px 16px;
    border: none;
    border-radius: 8px;
    background: #d05050;
    color: white;
    cursor: pointer;
    transition: background 0.2s;
}
.stop-btn:hover { background: #c04040; }
.stop-btn:active { background: #b03030; }
.stop-btn:disabled { background: #c0b0a0; cursor: default; }
</style>

</head>
<body>
<div class="game-container">
    <h1>3-6-9-12 连线棋</h1>
    <div class="status-bar" id="statusBar">人类先手 (绿色) — 请点击棋盘下子</div>

    <div class="board-wrapper">
        <canvas id="boardCanvas"></canvas>
        <div class="score-panel">
            <div class="score-card">
                <div class="player-name human">● 人类</div>
                <div class="score-value human" id="humanScore">0</div>
                <div class="score-label">分</div>
            </div>
            <div class="score-card">
                <div class="player-name ai">● AI</div>
                <div class="score-value ai" id="aiScore">0</div>
                <div class="score-label">分</div>
            </div>
        </div>
    </div>
    <div class="info-panel">
        <button class="reset-btn" id="resetBtn">重置游戏</button>
        <button class="stop-btn" id="stopBtn" disabled>停止游戏</button>
    </div>
    <div class="turn-indicator" id="turnIndicator">● 轮到人类</div>
    <div class="history-panel" id="historyPanel">
        <div class="hist-title">📜 移动记录</div>
        <div id="historyContent"><em style="color:#a09080;">暂无记录</em></div>
    </div>
</div>

<script>
// ============================================================
//  3-6-9-12 连线棋 (人机对战版) — HTML5 Canvas
// ============================================================

// ---- Constants ----
const SIZE = 12;
const EMPTY = 0, HUMAN = 1, AI = 2;
const VALID_LENGTHS = [3, 6, 9, 12];

// ---- Canvas setup (full screen board) ----
const CELL = 48;
const PAD = 20;
const RADIUS = 20;

const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');
canvas.width = PAD * 2 + CELL * SIZE;
canvas.height = PAD * 2 + CELL * SIZE;

// ---- DOM refs ----
const statusBar = document.getElementById('statusBar');
const humanScoreSpan = document.getElementById('humanScore');
const aiScoreSpan = document.getElementById('aiScore');
const turnIndicator = document.getElementById('turnIndicator');

// ---- Game state ----
let grid = [];
let redLines = [];
let humanScore = 0;
let aiScore = 0;
let currentPlayer = HUMAN;
let gameOver = false;
let extraTurn = false;
let aiThinking = false;

// ---- Move history ----
let moveHistory = [];
let moveNumber = 0;
let gameStopped = false;
const historyContent = document.getElementById('historyContent');
const stopBtn = document.getElementById('stopBtn');

function recordMove(row, col, player) {
    moveNumber++;
    const playerChar = player === HUMAN ? 'h' : 'a';
    const entry = padNumber(moveNumber, 3) + playerChar + '(' + row + ',' + col + ')';
    moveHistory.push(entry);
    updateHistoryDisplay();
}

function padNumber(num, len) {
    return String(num).padStart(len, '0');
}

function updateHistoryDisplay() {
    if (moveHistory.length === 0) {
        historyContent.innerHTML = '<em style="color:#a09080;">暂无记录</em>';
        return;
    }
    let html = '';
    for (let i = 0; i < moveHistory.length; i++) {
        const entry = moveHistory[i];
        const isHuman = entry.includes('h(');
        const cls = isHuman ? 'human' : 'ai';
        html += '<div class="hist-entry ' + cls + '">#' + entry + '</div>';
    }
    historyContent.innerHTML = html;
    // Auto-scroll to bottom
    const panel = document.getElementById('historyPanel');
    panel.scrollTop = panel.scrollHeight;
}

function stopGame() {
    gameStopped = true;
    gameOver = true;
    aiThinking = false;
    stopBtn.disabled = true;
    setStatus('⏹ 游戏已停止！移动记录已保存');
    updateTurnIndicator();
    // Show the move history in console for easy copy
    console.log('=== 移动记录 ===');
    console.log(moveHistory.join(', '));
    console.log('人类得分:', humanScore, 'AI得分:', aiScore);
}

stopBtn.addEventListener('click', stopGame);


// ---- Board functions ----
function initGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < SIZE; c++) {
            grid[r][c] = EMPTY;
        }
    }
}

function getCell(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return -1;
    return grid[r][c];
}

function isEmpty(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE && grid[r][c] === EMPTY;
}

function placePiece(r, c, player) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
    if (grid[r][c] !== EMPTY) return false;
    grid[r][c] = player;
    return true;
}

function isBoardFull() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) return false;
        }
    }
    return true;
}

// ---- RedLine management ----
function addRedLine(row, col, horizontal, length) {
    redLines = redLines.filter(existing => {
        if (existing.horizontal !== horizontal) return true;
        if (horizontal) {
            if (existing.row !== row) return true;
            const eStart = existing.col;
            const eEnd = existing.col + existing.length - 1;
            const nStart = col;
            const nEnd = col + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        } else {
            if (existing.col !== col) return true;
            const eStart = existing.row;
            const eEnd = existing.row + existing.length - 1;
            const nStart = row;
            const nEnd = row + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        }
    });
    redLines.push({ row, col, horizontal, length });
}

// ---- Line detection: count ANY occupied cells (regardless of color) ----
function countConsecutiveOccupied(row, col, horizontal) {
    let count = 1;
    if (horizontal) {
        for (let c = col - 1; c >= 0; c--) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
        for (let c = col + 1; c < SIZE; c++) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
    } else {
        for (let r = row - 1; r >= 0; r--) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
        for (let r = row + 1; r < SIZE; r++) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
    }
    return count;
}

function findHorizontalStart(row, col) {
    let start = col;
    for (let c = col - 1; c >= 0; c--) {
        if (getCell(row, c) !== EMPTY) start = c; else break;
    }
    return start;
}

function findVerticalStart(row, col) {
    let start = row;
    for (let r = row - 1; r >= 0; r--) {
        if (getCell(r, col) !== EMPTY) start = r; else break;
    }
    return start;
}

function checkAllLines(row, col) {
    const results = [];
    const hCount = countConsecutiveOccupied(row, col, true);
    for (const len of VALID_LENGTHS) {
        if (hCount === len) {
            const startCol = findHorizontalStart(row, col);
            results.push({ startRow: row, startCol, endRow: row, endCol: startCol + len - 1, horizontal: true, length: len, score: len });
        }
    }
    const vCount = countConsecutiveOccupied(row, col, false);
    for (const len of VALID_LENGTHS) {
        if (vCount === len) {
            const startRow = findVerticalStart(row, col);
            results.push({ startRow, startCol: col, endRow: startRow + len - 1, endCol: col, horizontal: false, length: len, score: len });
        }
    }
    return results;
}

// ---- Process a move ----
function processMove(row, col, player) {
    const result = { valid: false, scored: false, score: 0, redLine: null, gameEnded: false };

    if (!placePiece(row, col, player)) {
        return result;
    }
    result.valid = true;

    const scoredLines = checkAllLines(row, col);

    if (scoredLines.length > 0) {
        let bestLine = scoredLines[0];
        for (const line of scoredLines) {
            if (line.score > bestLine.score) bestLine = line;
        }

        if (player === HUMAN) {
            humanScore += bestLine.score;
        } else {
            aiScore += bestLine.score;
        }

        addRedLine(bestLine.startRow, bestLine.startCol, bestLine.horizontal, bestLine.length);

        result.scored = true;
        result.score = bestLine.score;
        result.redLine = { row: bestLine.startRow, col: bestLine.startCol, horizontal: bestLine.horizontal, length: bestLine.length };

        extraTurn = true;
    } else {
        extraTurn = false;
    }

    if (isBoardFull()) {
        gameOver = true;
        result.gameEnded = true;
    }

    return result;
}

// ---- AI ----
function getAllEmptyCells() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) empty.push([r, c]);
        }
    }
    return empty;
}

/**
 * Evaluate if AI placing here would create a scoring line (exactly 3/6/9/12).
 */
function evaluateScorePotential(row, col) {
    grid[row][col] = AI;

    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;

    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;

    grid[row][col] = EMPTY;
    return score;
}

/**
 * Evaluate if opponent could score by placing here (exactly 3/6/9/12).
 */
function evaluateBlockPotential(row, col) {
    grid[row][col] = HUMAN;

    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;

    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;

    grid[row][col] = EMPTY;
    return score;
}

/**
 * Evaluate if placing here gives the opponent a chance to score on their next move.
 * After AI places at (row, col), check ALL empty cells to see if the human
 * could place there and score (exactly 3/6/9/12).
 * This catches both consecutive threats (A A _) and one-gap threats (A _ a).
 */
function evaluateDangerPotential(row, col) {
    // Temporarily place AI piece
    grid[row][col] = AI;

    let maxHumanScore = 0;

    // Check every empty cell to see if human could score there
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] !== EMPTY) continue;

            // Temporarily place human piece
            grid[r][c] = HUMAN;

            const hCount = countConsecutiveOccupied(r, c, true);
            const vCount = countConsecutiveOccupied(r, c, false);

            let humanScore = 0;
            if (hCount === 12) humanScore = 12;
            else if (hCount === 9) humanScore = 9;
            else if (hCount === 6) humanScore = 6;
            else if (hCount === 3) humanScore = 3;

            if (vCount === 12) humanScore = Math.max(humanScore, 12);
            else if (vCount === 9) humanScore = Math.max(humanScore, 9);
            else if (vCount === 6) humanScore = Math.max(humanScore, 6);
            else if (vCount === 3) humanScore = Math.max(humanScore, 3);

            if (humanScore > maxHumanScore) {
                maxHumanScore = humanScore;
            }

            // Remove temporary human piece
            grid[r][c] = EMPTY;
        }
    }

    // Remove temporary AI piece
    grid[row][col] = EMPTY;

    // Penalty proportional to what the human could score
    return maxHumanScore;
}

function getBestAIMove() {
    const emptyCells = getAllEmptyCells();
    if (emptyCells.length === 0) return null;

    let bestScore = -Infinity;
    let bestMoves = [];

    for (const cell of emptyCells) {
        const row = cell[0], col = cell[1];
        let score = 0;

        // High priority: scoring potential
        score += evaluateScorePotential(row, col) * 100;
        // Medium priority: blocking opponent's scoring potential
        score += evaluateBlockPotential(row, col) * 50;
        // Low priority: center preference
        const centerDist = Math.abs(row - SIZE / 2) + Math.abs(col - SIZE / 2);
        score += (SIZE - centerDist);
        // Heavy penalty: creating 2/5/8/11 (gives opponent a chance)
        score -= evaluateDangerPotential(row, col) * 200;

        if (score > bestScore) {
            bestScore = score;
            bestMoves = [[row, col]];
        } else if (score === bestScore) {
            bestMoves.push([row, col]);
        }
    }

    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// ---- Drawing ----
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#dcc8a8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#8a7a6a';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= SIZE; i++) {
        const x = PAD + i * CELL;
        const y = PAD + i * CELL;
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(PAD + SIZE * CELL, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, PAD + SIZE * CELL);
        ctx.stroke();
    }

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (cell !== EMPTY) {
                const cx = PAD + c * CELL + CELL / 2;
                const cy = PAD + r * CELL + CELL / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = cell === HUMAN ? '#66cc66' : '#c07020';
                ctx.fill();
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Draw move number inside the circle
                const moveIdx = moveHistory.findIndex(entry => {
                    const parts = entry.split(/[h,a]\(/);
                    if (parts.length < 2) return false;
                    const coords = parts[1].replace(')', '');
                    const [mr, mc] = coords.split(',').map(Number);
                    return mr === r && mc === c;
                });
                if (moveIdx !== -1) {
                    const num = moveIdx + 1;
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = 'bold 18px Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, cx, cy);
                }

            }
        }
    }

    ctx.strokeStyle = '#dc2020';
    ctx.lineWidth = 2.0;
    for (const line of redLines) {
        if (line.horizontal) {
            const y = PAD + line.row * CELL + CELL / 2;
            const x1 = PAD + line.col * CELL + CELL / 2;
            const x2 = PAD + (line.col + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.stroke();
        } else {
            const x = PAD + line.col * CELL + CELL / 2;
            const y1 = PAD + line.row * CELL + CELL / 2;
            const y2 = PAD + (line.row + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
            ctx.stroke();
        }
    }
}

function updateUI() {
    humanScoreSpan.textContent = humanScore;
    aiScoreSpan.textContent = aiScore;
    drawBoard();
}

function setStatus(msg) {
    statusBar.textContent = msg;
}

function updateTurnIndicator() {
    if (gameOver) {
        turnIndicator.textContent = '● 游戏结束';
        turnIndicator.style.color = '#888';
        return;
    }
    if (currentPlayer === HUMAN) {
        turnIndicator.textContent = '● 轮到人类 (绿色)';

        turnIndicator.style.color = '#2a5db0';
    } else {
        turnIndicator.textContent = '● 轮到 AI (橙色)';
        turnIndicator.style.color = '#c07020';
    }
}

// ---- Game flow ----
function handleHumanMove(row, col) {
    if (gameOver) return;
    if (currentPlayer !== HUMAN) return;
    if (aiThinking) return;
    if (!isEmpty(row, col)) return;

    const result = processMove(row, col, HUMAN);
    if (!result.valid) return;

    recordMove(row, col, HUMAN);
    updateUI();

    if (result.gameEnded) {
        showGameOver();
        return;
    }

    if (result.scored) {
        setStatus('人类得分 +' + result.score + '！获得额外回合！');
        updateTurnIndicator();
    } else {
        setStatus('AI 思考中...');
        currentPlayer = AI;
        updateTurnIndicator();
        startAIMove();
    }
}


function startAIMove() {
    aiThinking = true;
    setTimeout(() => {
        doAIMove();
    }, 300);
}

function doAIMove() {
    if (gameOver) {
        aiThinking = false;
        return;
    }

    const move = getBestAIMove();
    if (!move) {
        aiThinking = false;
        return;
    }

    const row = move[0], col = move[1];
    const result = processMove(row, col, AI);

    recordMove(row, col, AI);
    updateUI();


    if (result.gameEnded) {
        showGameOver();
        aiThinking = false;
        return;
    }

    if (result.scored) {
        setStatus('AI 得分 +' + result.score + '！AI获得额外回合！');
        updateTurnIndicator();
        setTimeout(() => doAIMove(), 300);
    } else {
        setStatus('轮到人类 (绿色) — 请点击棋盘下子');

        currentPlayer = HUMAN;
        aiThinking = false;
        updateTurnIndicator();
    }
}

function showGameOver() {
    let message;
    if (humanScore > aiScore) {
        message = '🎉 人类获胜！\n人类: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else if (aiScore > humanScore) {
        message = '🤖 AI 获胜！\n人类: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else {
        message = '🤝 平局！\n双方: ' + humanScore + ' 分';
    }
    setStatus('游戏结束！');
    updateTurnIndicator();
    setTimeout(() => {
        alert(message);
    }, 100);
}

function resetGame() {
    aiThinking = false;
    initGrid();
    redLines = [];
    humanScore = 0;
    aiScore = 0;
    currentPlayer = HUMAN;
    gameOver = false;
    extraTurn = false;
    gameStopped = false;
    moveHistory = [];
    moveNumber = 0;
    stopBtn.disabled = false;
    updateHistoryDisplay();
    updateUI();
    setStatus('人类先手 (绿色) — 请点击棋盘下子');

    updateTurnIndicator();
}


// ---- Canvas click handler ----
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const col = Math.floor((mx - PAD) / CELL);
    const row = Math.floor((my - PAD) / CELL);

    if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
    handleHumanMove(row, col);
});

// ---- Reset button ----
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ---- Init ----
initGrid();
updateUI();
updateTurnIndicator();
</script>
</body>
