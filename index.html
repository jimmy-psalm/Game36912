<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3-6-9-12 連線棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0e8d8;
    font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    overflow: auto;
}
.game-container {
    background: #e8dcc8;
    border-radius: 16px;
    padding: 12px 16px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 98vw;
}
h1 {
    font-size: 20px;
    color: #3d2b1a;
    margin-bottom: 4px;
    letter-spacing: 2px;
}
.status-bar {
    font-size: 13px;
    color: #5a4030;
    margin-bottom: 6px;
    min-height: 20px;
    line-height: 20px;
}
.board-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
}
canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    background: #dcc8a8;
    box-shadow: inset 0 0 0 1px #b8a080;
}
.score-panel {
    display: flex;
    gap: 8px;
    min-width: 100px;
}
.score-card {
    background: #f5ede0;
    border-radius: 10px;
    padding: 6px 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    text-align: center;
    flex: 1;
}
.score-card .player-name {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 1px;
}
.score-card .player-name.human { color: #66cc66; }
.score-card .player-name.ai { color: #c07020; }
.score-card .score-value {
    font-size: 24px;
    font-weight: bold;
}
.score-card .score-value.human { color: #66cc66; }
.score-card .score-value.ai { color: #c07020; }
.score-card .score-label {
    font-size: 11px;
    color: #8a7a6a;
}
.info-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.info-panel button {
    font-size: 13px;
    font-weight: bold;
    padding: 5px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
}
.reset-btn {
    background: #c8b498;
    color: #3d2b1a;
}
.reset-btn:hover { background: #b8a488; }
.reset-btn:active { background: #a89478; }
.copy-btn {
    background: #5a8ab5;
    color: white;
}
.copy-btn:hover { background: #4a7aa5; }
.copy-btn:active { background: #3a6a95; }
.copy-btn:disabled { background: #c0b0a0; cursor: default; }

.zoom-btn {
    background: #b8a888;
    color: #3d2b1a;
    font-size: 16px !important;
    padding: 5px 12px !important;
    min-width: 36px;
}
.zoom-btn:hover { background: #a89878; }
.zoom-btn:active { background: #988868; }
.turn-indicator {
    font-size: 12px;
    color: #6a5040;
    margin-top: 4px;
}

/* Portrait mode: score panel below board, side by side */
@media (orientation: portrait) {
    .board-wrapper {
        flex-direction: column;
        align-items: center;
    }
    .score-panel {
        flex-direction: row;
        width: 100%;
        max-width: 500px;
    }
}

/* Landscape mode: score panel to the right of board, stacked vertically */
@media (orientation: landscape) {
    .board-wrapper {
        flex-direction: row;
        align-items: flex-start;
    }
    .score-panel {
        flex-direction: column;
        min-width: 100px;
    }
}
</style>
</head>
<body>
<div class="game-container">
    <h1>3-6-9-12</h1>
    <div class="status-bar" id="statusBar">人類先手 (綠色) — 請點擊棋盤下子</div>
    <div class="board-wrapper">
        <canvas id="boardCanvas"></canvas>
        <div class="score-panel" id="scorePanel">
            <div class="score-card">
                <div class="player-name human">● 人類</div>
                <div class="score-value human" id="humanScore">0</div>
                <div class="score-label">分</div>
            </div>
            <div class="score-card">
                <div class="player-name ai">● AI</div>
                <div class="score-value ai" id="aiScore">0</div>
                <div class="score-label">分</div>
            </div>
        </div>
    </div>
    <div class="info-panel">
        <button class="zoom-btn" id="zoomOutBtn">−</button>
        <button class="reset-btn" id="resetBtn">重置</button>
        <button class="copy-btn" id="copyBtn">📋 複製記錄</button>

        <button class="zoom-btn" id="zoomInBtn">+</button>
    </div>
    <div class="turn-indicator" id="turnIndicator">● 輪到人類</div>
</div>

<script>
// ============================================================
//  3-6-9-12 連線棋 (人機對戰版) — HTML5 Canvas
// ============================================================

// ---- Constants ----
const SIZE = 12;
const EMPTY = 0, HUMAN = 1, AI = 2;
const VALID_LENGTHS = [3, 6, 9, 12];

// ---- Canvas setup ----
let CELL = 48;
let PAD = 20;
let RADIUS = 20;
let zoomLevel = 1.0;

const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');

// ---- DOM refs ----
const statusBar = document.getElementById('statusBar');
const humanScoreSpan = document.getElementById('humanScore');
const aiScoreSpan = document.getElementById('aiScore');
const turnIndicator = document.getElementById('turnIndicator');
const copyBtn = document.getElementById('copyBtn');


// ---- Game state ----
let grid = [];
let redLines = [];
let humanScore = 0;
let aiScore = 0;
let currentPlayer = HUMAN;
let gameOver = false;
let extraTurn = false;
let aiThinking = false;
let lastMoveR = -1, lastMoveC = -1;

// ---- Move history (hidden, only in console) ----
let moveHistory = [];
let moveNumber = 0;
let gameStopped = false;

function recordMove(row, col, player) {
    moveNumber++;
    const playerChar = player === HUMAN ? 'h' : 'a';
    const entry = padNumber(moveNumber, 3) + playerChar + '(' + row + ',' + col + ')';
    moveHistory.push(entry);
}

function padNumber(num, len) {
    return String(num).padStart(len, '0');
}

function copyHistory() {
    if (moveHistory.length === 0) {
        setStatus('⚠️ 暫無移動記錄');
        return;
    }
    const text = moveHistory.join(', ');
    navigator.clipboard.writeText(text).then(() => {
        setStatus('✅ 已複製 ' + moveHistory.length + ' 步移動記錄到剪貼板');
        console.log('=== 移動記錄 ===');
        console.log(text);
        console.log('人類得分:', humanScore, 'AI得分:', aiScore);
    }).catch(() => {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setStatus('✅ 已複製 ' + moveHistory.length + ' 步移動記錄到剪貼板');
        console.log('=== 移動記錄 ===');
        console.log(text);
        console.log('人類得分:', humanScore, 'AI得分:', aiScore);
    });
}

copyBtn.addEventListener('click', copyHistory);


// ---- Auto-fit board to screen size ----
function autoFitBoard() {
    const isLandscape = window.innerWidth > window.innerHeight;
    let availableWidth;

    if (isLandscape) {
        // Landscape: score panel is on the right (~120px), board on the left
        availableWidth = window.innerWidth - 140; // 120px for score + 20px gap
    } else {
        // Portrait: score panel is below the board, full width available
        availableWidth = window.innerWidth - 20; // 10px margin on each side
    }

    // Also account for game-container padding (~32px)
    availableWidth -= 32;

    // Calculate cell size to fit the board
    const maxCell = Math.floor((availableWidth - 40) / SIZE); // 40 = PAD*2
    const clampedCell = Math.max(20, Math.min(48, maxCell));

    // Set zoom level based on the ratio to default 48px
    zoomLevel = clampedCell / 48;
    CELL = clampedCell;
    PAD = Math.round(20 * zoomLevel);
    RADIUS = Math.round(20 * zoomLevel);
    canvas.width = PAD * 2 + CELL * SIZE;
    canvas.height = PAD * 2 + CELL * SIZE;

    // Scale UI font sizes
    const baseFont = 13;
    const newFont = Math.round(baseFont * Math.sqrt(zoomLevel));
    document.querySelectorAll('.info-panel button').forEach(btn => {
        btn.style.fontSize = newFont + 'px';
    });
    document.querySelectorAll('.score-card .score-value').forEach(el => {
        el.style.fontSize = Math.round(24 * Math.sqrt(zoomLevel)) + 'px';
    });
    document.querySelectorAll('.score-card .player-name').forEach(el => {
        el.style.fontSize = Math.round(12 * Math.sqrt(zoomLevel)) + 'px';
    });
    document.querySelectorAll('.score-card .score-label').forEach(el => {
        el.style.fontSize = Math.round(11 * Math.sqrt(zoomLevel)) + 'px';
    });
    statusBar.style.fontSize = Math.round(13 * Math.sqrt(zoomLevel)) + 'px';
    turnIndicator.style.fontSize = Math.round(12 * Math.sqrt(zoomLevel)) + 'px';
    drawBoard();
}

// ---- Zoom controls (manual override) ----
function resizeBoard(factor) {
    const newZoom = zoomLevel * factor;
    if (newZoom < 0.3 || newZoom > 3.0) return;
    zoomLevel = newZoom;
    CELL = Math.round(48 * zoomLevel);
    PAD = Math.round(20 * zoomLevel);
    RADIUS = Math.round(20 * zoomLevel);
    canvas.width = PAD * 2 + CELL * SIZE;
    canvas.height = PAD * 2 + CELL * SIZE;
    // Scale UI font sizes
    const baseFont = 13;
    const newFont = Math.round(baseFont * Math.sqrt(zoomLevel));
    document.querySelectorAll('.info-panel button').forEach(btn => {
        btn.style.fontSize = newFont + 'px';
    });
    document.querySelectorAll('.score-card .score-value').forEach(el => {
        el.style.fontSize = Math.round(24 * Math.sqrt(zoomLevel)) + 'px';
    });
    document.querySelectorAll('.score-card .player-name').forEach(el => {
        el.style.fontSize = Math.round(12 * Math.sqrt(zoomLevel)) + 'px';
    });
    document.querySelectorAll('.score-card .score-label').forEach(el => {
        el.style.fontSize = Math.round(11 * Math.sqrt(zoomLevel)) + 'px';
    });
    statusBar.style.fontSize = Math.round(13 * Math.sqrt(zoomLevel)) + 'px';
    turnIndicator.style.fontSize = Math.round(12 * Math.sqrt(zoomLevel)) + 'px';
    drawBoard();
}

document.getElementById('zoomInBtn').addEventListener('click', () => resizeBoard(1.1));
document.getElementById('zoomOutBtn').addEventListener('click', () => resizeBoard(1 / 1.1));

// ---- Board functions ----
function initGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < SIZE; c++) {
            grid[r][c] = EMPTY;
        }
    }
}

function getCell(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return -1;
    return grid[r][c];
}

function isEmpty(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE && grid[r][c] === EMPTY;
}

function placePiece(r, c, player) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
    if (grid[r][c] !== EMPTY) return false;
    grid[r][c] = player;
    return true;
}

function isBoardFull() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) return false;
        }
    }
    return true;
}

// ---- RedLine management ----
function addRedLine(row, col, horizontal, length) {
    redLines = redLines.filter(existing => {
        if (existing.horizontal !== horizontal) return true;
        if (horizontal) {
            if (existing.row !== row) return true;
            const eStart = existing.col;
            const eEnd = existing.col + existing.length - 1;
            const nStart = col;
            const nEnd = col + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        } else {
            if (existing.col !== col) return true;
            const eStart = existing.row;
            const eEnd = existing.row + existing.length - 1;
            const nStart = row;
            const nEnd = row + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        }
    });
    redLines.push({ row, col, horizontal, length });
}

// ---- Line detection: count ANY occupied cells (regardless of color) ----
function countConsecutiveOccupied(row, col, horizontal) {
    let count = 1;
    if (horizontal) {
        for (let c = col - 1; c >= 0; c--) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
        for (let c = col + 1; c < SIZE; c++) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
    } else {
        for (let r = row - 1; r >= 0; r--) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
        for (let r = row + 1; r < SIZE; r++) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
    }
    return count;
}

function findHorizontalStart(row, col) {
    let start = col;
    for (let c = col - 1; c >= 0; c--) {
        if (getCell(row, c) !== EMPTY) start = c; else break;
    }
    return start;
}

function findVerticalStart(row, col) {
    let start = row;
    for (let r = row - 1; r >= 0; r--) {
        if (getCell(r, col) !== EMPTY) start = r; else break;
    }
    return start;
}

function checkAllLines(row, col) {
    const results = [];
    const hCount = countConsecutiveOccupied(row, col, true);
    for (const len of VALID_LENGTHS) {
        if (hCount === len) {
            const startCol = findHorizontalStart(row, col);
            results.push({ startRow: row, startCol, endRow: row, endCol: startCol + len - 1, horizontal: true, length: len, score: len });
        }
    }
    const vCount = countConsecutiveOccupied(row, col, false);
    for (const len of VALID_LENGTHS) {
        if (vCount === len) {
            const startRow = findVerticalStart(row, col);
            results.push({ startRow, startCol: col, endRow: startRow + len - 1, endCol: col, horizontal: false, length: len, score: len });
        }
    }
    return results;
}

// ---- Process a move ----
function processMove(row, col, player) {
    const result = { valid: false, scored: false, score: 0, redLine: null, gameEnded: false };

    if (!placePiece(row, col, player)) {
        return result;
    }
    result.valid = true;

    const scoredLines = checkAllLines(row, col);

    if (scoredLines.length > 0) {
        let bestLine = scoredLines[0];
        for (const line of scoredLines) {
            if (line.score > bestLine.score) bestLine = line;
        }

        if (player === HUMAN) {
            humanScore += bestLine.score;
        } else {
            aiScore += bestLine.score;
        }

        addRedLine(bestLine.startRow, bestLine.startCol, bestLine.horizontal, bestLine.length);

        result.scored = true;
        result.score = bestLine.score;
        result.redLine = { row: bestLine.startRow, col: bestLine.startCol, horizontal: bestLine.horizontal, length: bestLine.length };

        extraTurn = true;
    } else {
        extraTurn = false;
    }

    if (isBoardFull()) {
        gameOver = true;
        result.gameEnded = true;
    }

    return result;
}

// ---- AI ----
function getAllEmptyCells() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) empty.push([r, c]);
        }
    }
    return empty;
}

function evaluateScorePotential(row, col) {
    grid[row][col] = AI;
    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;
    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;
    grid[row][col] = EMPTY;
    return score;
}

function evaluateBlockPotential(row, col) {
    grid[row][col] = HUMAN;
    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount === 12) score += 12;
    else if (hCount === 9) score += 9;
    else if (hCount === 6) score += 6;
    else if (hCount === 3) score += 3;
    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount === 12) score += 12;
    else if (vCount === 9) score += 9;
    else if (vCount === 6) score += 6;
    else if (vCount === 3) score += 3;
    grid[row][col] = EMPTY;
    return score;
}

function evaluateDangerPotential(row, col) {
    // Temporarily place AI at (row,col)
    grid[row][col] = AI;
    // Check all cells in the same row and column for human scoring opportunities.
    // Only check one level deep (no recursion) to avoid overcounting.
    let maxHumanScore = 0;
    
    // Check all cells in the same ROW
    for (let c = 0; c < SIZE; c++) {
        if (grid[row][c] !== EMPTY) continue;
        grid[row][c] = HUMAN;
        const hCount = countConsecutiveOccupied(row, c, true);
        const vCount = countConsecutiveOccupied(row, c, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[row][c] = EMPTY;
        if (score > maxHumanScore) maxHumanScore = score;
    }
    
    // Check all cells in the same COLUMN
    for (let r = 0; r < SIZE; r++) {
        if (grid[r][col] !== EMPTY) continue;
        grid[r][col] = HUMAN;
        const hCount = countConsecutiveOccupied(r, col, true);
        const vCount = countConsecutiveOccupied(r, col, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[r][col] = EMPTY;
        if (score > maxHumanScore) maxHumanScore = score;
    }
    
    grid[row][col] = EMPTY;
    return maxHumanScore;
}





function evaluateAIChainPotential(row, col) {
    // Temporarily place AI at (row,col)
    grid[row][col] = AI;
    // Simulate AI's chain of scoring moves (extra turns after scoring).
    const totalScore = simulateChain(row, col, AI);
    grid[row][col] = EMPTY;
    return totalScore;
}

// Recursively simulate chain scoring for a given player.
// (pr, pc) = the row and column of the last placed piece.
// player = HUMAN or AI - the player to simulate.
// Only checks cells in the same row or column as (pr, pc),
// because a piece can only create scoring opportunities in its own row/column.
// depth parameter prevents infinite recursion.
function simulateChain(pr, pc, player, depth) {
    if (depth === undefined) depth = 0;
    if (depth >= 6) return 0; // Limit recursion depth

    let bestScore = 0;
    let bestR = -1, bestC = -1;

    // Check all cells in the same ROW as the last placed piece
    for (let c = 0; c < SIZE; c++) {
        if (grid[pr][c] !== EMPTY) continue;
        grid[pr][c] = player;
        const hCount = countConsecutiveOccupied(pr, c, true);
        const vCount = countConsecutiveOccupied(pr, c, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[pr][c] = EMPTY;
        if (score > bestScore) {
            bestScore = score;
            bestR = pr;
            bestC = c;
        }
    }

    // Check all cells in the same COLUMN as the last placed piece
    for (let r = 0; r < SIZE; r++) {
        if (grid[r][pc] !== EMPTY) continue;
        grid[r][pc] = player;
        const hCount = countConsecutiveOccupied(r, pc, true);
        const vCount = countConsecutiveOccupied(r, pc, false);
        let score = 0;
        if (hCount === 12) score = 12;
        else if (hCount === 9) score = 9;
        else if (hCount === 6) score = 6;
        else if (hCount === 3) score = 3;
        if (vCount === 12) score = Math.max(score, 12);
        else if (vCount === 9) score = Math.max(score, 9);
        else if (vCount === 6) score = Math.max(score, 6);
        else if (vCount === 3) score = Math.max(score, 3);
        grid[r][pc] = EMPTY;
        if (score > bestScore) {
            bestScore = score;
            bestR = r;
            bestC = pc;
        }
    }

    if (bestScore === 0) return 0; // No scoring move for this player

    // Simulate player placing at the best scoring cell
    grid[bestR][bestC] = player;
    // Player gets extra turn, so recursively check for more scoring
    const chainScore = simulateChain(bestR, bestC, player, depth + 1);
    grid[bestR][bestC] = EMPTY;

    return bestScore + chainScore;
}





function getBestAIMove() {
    const emptyCells = getAllEmptyCells();
    if (emptyCells.length === 0) return null;
    let bestScore = -Infinity;
    let bestMoves = [];
    for (const cell of emptyCells) {
        const row = cell[0], col = cell[1];
        let score = 0;
        // AI's immediate scoring potential
        const immediateScore = evaluateScorePotential(row, col);
        score += immediateScore * 100;
        // AI's chain scoring potential (extra turns after scoring)
        // Only evaluate if AI can score immediately (otherwise no extra turn)
        let aiChain = 0;
        if (immediateScore > 0) {
            aiChain = evaluateAIChainPotential(row, col);
            score += aiChain * 100;
        }
        // Blocking potential
        score += evaluateBlockPotential(row, col) * 50;
        // Center preference
        const centerDist = Math.abs(row - SIZE / 2) + Math.abs(col - SIZE / 2);
        score += (SIZE - centerDist);
        // Danger from human's chain scoring
        score -= evaluateDangerPotential(row, col) * 200;
        if (score > bestScore) {
            bestScore = score;
            bestMoves = [[row, col]];
        } else if (score === bestScore) {
            bestMoves.push([row, col]);
        }
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}


// ---- Drawing ----
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#dcc8a8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#8a7a6a';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= SIZE; i++) {
        const x = PAD + i * CELL;
        const y = PAD + i * CELL;
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(PAD + SIZE * CELL, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, PAD + SIZE * CELL);
        ctx.stroke();
    }

    const fontSize = Math.max(10, Math.round(RADIUS * 0.9));

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (cell !== EMPTY) {
                const cx = PAD + c * CELL + CELL / 2;
                const cy = PAD + r * CELL + CELL / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = cell === HUMAN ? '#66cc66' : '#c07020';
                ctx.fill();
                // Highlight the last move with a bright yellow border
                const isLastMove = (r === lastMoveR && c === lastMoveC);
                if (isLastMove) {
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 3.5;
                } else {
                    ctx.strokeStyle = '#3a2a1a';
                    ctx.lineWidth = 1.5;
                }
                ctx.stroke();

                // Draw move number inside the circle
                const moveIdx = moveHistory.findIndex(entry => {
                    const parts = entry.split(/[h,a]\(/);
                    if (parts.length < 2) return false;
                    const coords = parts[1].replace(')', '');
                    const [mr, mc] = coords.split(',').map(Number);
                    return mr === r && mc === c;
                });
                if (moveIdx !== -1) {
                    const num = moveIdx + 1;
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, cx, cy);
                }
            }
        }
    }

    ctx.strokeStyle = '#dc2020';
    ctx.lineWidth = 2.0;
    for (const line of redLines) {
        if (line.horizontal) {
            const y = PAD + line.row * CELL + CELL / 2;
            const x1 = PAD + line.col * CELL + CELL / 2;
            const x2 = PAD + (line.col + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.stroke();
        } else {
            const x = PAD + line.col * CELL + CELL / 2;
            const y1 = PAD + line.row * CELL + CELL / 2;
            const y2 = PAD + (line.row + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
            ctx.stroke();
        }
    }
}

function updateUI() {
    humanScoreSpan.textContent = humanScore;
    aiScoreSpan.textContent = aiScore;
    drawBoard();
}

function setStatus(msg) {
    statusBar.textContent = msg;
}

function updateTurnIndicator() {
    if (gameOver) {
        turnIndicator.textContent = '● 遊戲結束';
        turnIndicator.style.color = '#888';
        return;
    }
    if (currentPlayer === HUMAN) {
        turnIndicator.textContent = '● 輪到人類 (綠色)';
        turnIndicator.style.color = '#66cc66';
    } else {
        turnIndicator.textContent = '● 輪到 AI (橙色)';
        turnIndicator.style.color = '#c07020';
    }
}

// ---- Game flow ----
function handleHumanMove(row, col) {
    if (gameOver) return;
    if (currentPlayer !== HUMAN) return;
    if (aiThinking) return;
    if (!isEmpty(row, col)) return;

    const result = processMove(row, col, HUMAN);
    if (!result.valid) return;

    recordMove(row, col, HUMAN);
    lastMoveR = row;
    lastMoveC = col;
    updateUI();

    if (result.gameEnded) {
        showGameOver();
        return;
    }

    if (result.scored) {
        setStatus('人類得分 +' + result.score + '！獲得額外回合！');
        updateTurnIndicator();
    } else {
        setStatus('AI 思考中...');
        currentPlayer = AI;
        updateTurnIndicator();
        startAIMove();
    }
}

function startAIMove() {
    aiThinking = true;
    setTimeout(() => {
        doAIMove();
    }, 300);
}

function doAIMove() {
    if (gameOver) {
        aiThinking = false;
        return;
    }

    const move = getBestAIMove();
    if (!move) {
        aiThinking = false;
        return;
    }

    const row = move[0], col = move[1];
    const result = processMove(row, col, AI);

    recordMove(row, col, AI);
    lastMoveR = row;
    lastMoveC = col;
    updateUI();

    if (result.gameEnded) {
        showGameOver();
        aiThinking = false;
        return;
    }

    if (result.scored) {
        setStatus('AI 得分 +' + result.score + '！AI獲得額外回合！');
        updateTurnIndicator();
        setTimeout(() => doAIMove(), 300);
    } else {
        setStatus('輪到人類 (綠色) — 請點擊棋盤下子');
        currentPlayer = HUMAN;
        aiThinking = false;
        updateTurnIndicator();
    }
}

function showGameOver() {
    let message;
    if (humanScore > aiScore) {
        message = '🎉 人類獲勝！\n人類: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else if (aiScore > humanScore) {
        message = '🤖 AI 獲勝！\n人類: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else {
        message = '🤝 平局！\n雙方: ' + humanScore + ' 分';
    }
    setStatus('遊戲結束！');
    updateTurnIndicator();
    setTimeout(() => {
        alert(message);
    }, 100);
}

function resetGame() {
    aiThinking = false;
    initGrid();
    redLines = [];
    humanScore = 0;
    aiScore = 0;
    currentPlayer = HUMAN;
    gameOver = false;
    extraTurn = false;
    gameStopped = false;
    moveHistory = [];
    moveNumber = 0;
    lastMoveR = -1;
    lastMoveC = -1;
    copyBtn.disabled = false;

    updateUI();
    setStatus('人類先手 (綠色) — 請點擊棋盤下子');
    updateTurnIndicator();
}

// ---- Canvas click handler ----
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const col = Math.floor((mx - PAD) / CELL);
    const row = Math.floor((my - PAD) / CELL);

    if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
    handleHumanMove(row, col);
});

// ---- Reset button ----
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ---- Init ----
initGrid();
autoFitBoard();
updateUI();
updateTurnIndicator();

// Re-fit board on orientation / resize changes
window.addEventListener('resize', () => {
    autoFitBoard();
    updateUI();
});
</script>
