<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-6-9-12 连线棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0e8d8;
    font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
}
.game-container {
    background: #e8dcc8;
    border-radius: 16px;
    padding: 16px 24px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 700px;
}
h1 {
    font-size: 22px;
    color: #3d2b1a;
    margin-bottom: 4px;
    letter-spacing: 2px;
}
.status-bar {
    font-size: 14px;
    color: #5a4030;
    margin-bottom: 8px;
    min-height: 22px;
    line-height: 22px;
}
.board-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
}
canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    background: #dcc8a8;
    box-shadow: inset 0 0 0 1px #b8a080;
}
.score-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 120px;
    padding-top: 4px;
}
.score-card {
    background: #f5ede0;
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    text-align: left;
}
.score-card .player-name {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 2px;
}
.score-card .player-name.human { color: #2a5db0; }
.score-card .player-name.ai { color: #c07020; }
.score-card .score-value {
    font-size: 28px;
    font-weight: bold;
}
.score-card .score-value.human { color: #2a5db0; }
.score-card .score-value.ai { color: #c07020; }
.score-card .score-label {
    font-size: 12px;
    color: #8a7a6a;
}
.info-panel {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.reset-btn {
    font-size: 14px;
    font-weight: bold;
    padding: 6px 22px;
    border: none;
    border-radius: 8px;
    background: #c8b498;
    color: #3d2b1a;
    cursor: pointer;
    transition: background 0.2s;
}
.reset-btn:hover { background: #b8a488; }
.reset-btn:active { background: #a89478; }
.turn-indicator {
    font-size: 13px;
    color: #6a5040;
    margin-top: 6px;
}
</style>
</head>
<body>
<div class="game-container">
    <h1>3-6-9-12 连线棋</h1>
    <div class="status-bar" id="statusBar">人类先手 (蓝色) — 请点击棋盘下子</div>
    <div class="board-wrapper">
        <canvas id="boardCanvas"></canvas>
        <div class="score-panel">
            <div class="score-card">
                <div class="player-name human">● 人类</div>
                <div class="score-value human" id="humanScore">0</div>
                <div class="score-label">分</div>
            </div>
            <div class="score-card">
                <div class="player-name ai">● AI</div>
                <div class="score-value ai" id="aiScore">0</div>
                <div class="score-label">分</div>
            </div>
        </div>
    </div>
    <div class="info-panel">
        <button class="reset-btn" id="resetBtn">重置游戏</button>
    </div>
    <div class="turn-indicator" id="turnIndicator">● 轮到人类</div>
</div>
<script>
// ============================================================
//  3-6-9-12 连线棋 (人机对战版) — HTML5 Canvas
// ============================================================

// ---- Constants ----
const SIZE = 12;
const EMPTY = 0, HUMAN = 1, AI = 2;
const VALID_LENGTHS = [3, 6, 9, 12];

// ---- Canvas setup (smaller board, ~1/4 area) ----
const CELL = 24;
const PAD = 12;
const RADIUS = 9;
const canvas = document.getElementById('boardCanvas');
const ctx = canvas.getContext('2d');
canvas.width = PAD * 2 + CELL * SIZE;
canvas.height = PAD * 2 + CELL * SIZE;

// ---- DOM refs ----
const statusBar = document.getElementById('statusBar');
const humanScoreSpan = document.getElementById('humanScore');
const aiScoreSpan = document.getElementById('aiScore');
const turnIndicator = document.getElementById('turnIndicator');

// ---- Game state ----
let grid = [];
let redLines = [];
let humanScore = 0;
let aiScore = 0;
let currentPlayer = HUMAN;
let gameOver = false;
let extraTurn = false;
let aiThinking = false;

// ---- Board functions ----
function initGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
        grid[r] = [];
        for (let c = 0; c < SIZE; c++) {
            grid[r][c] = EMPTY;
        }
    }
}

function getCell(r, c) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return -1;
    return grid[r][c];
}

function isEmpty(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE && grid[r][c] === EMPTY;
}

function placePiece(r, c, player) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
    if (grid[r][c] !== EMPTY) return false;
    grid[r][c] = player;
    return true;
}

function isBoardFull() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) return false;
        }
    }
    return true;
}

// ---- RedLine management ----
function addRedLine(row, col, horizontal, length) {
    redLines = redLines.filter(existing => {
        if (existing.horizontal !== horizontal) return true;
        if (horizontal) {
            if (existing.row !== row) return true;
            const eStart = existing.col;
            const eEnd = existing.col + existing.length - 1;
            const nStart = col;
            const nEnd = col + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        } else {
            if (existing.col !== col) return true;
            const eStart = existing.row;
            const eEnd = existing.row + existing.length - 1;
            const nStart = row;
            const nEnd = row + length - 1;
            return (eEnd < nStart || eStart > nEnd);
        }
    });
    redLines.push({ row, col, horizontal, length });
}

// ---- Line detection: count ANY occupied cells (regardless of color) ----
function countConsecutiveOccupied(row, col, horizontal) {
    let count = 1;
    if (horizontal) {
        for (let c = col - 1; c >= 0; c--) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
        for (let c = col + 1; c < SIZE; c++) {
            if (getCell(row, c) !== EMPTY) count++; else break;
        }
    } else {
        for (let r = row - 1; r >= 0; r--) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
        for (let r = row + 1; r < SIZE; r++) {
            if (getCell(r, col) !== EMPTY) count++; else break;
        }
    }
    return count;
}

function findHorizontalStart(row, col) {
    let start = col;
    for (let c = col - 1; c >= 0; c--) {
        if (getCell(row, c) !== EMPTY) start = c; else break;
    }
    return start;
}

function findVerticalStart(row, col) {
    let start = row;
    for (let r = row - 1; r >= 0; r--) {
        if (getCell(r, col) !== EMPTY) start = r; else break;
    }
    return start;
}

function checkAllLines(row, col) {
    const results = [];
    const hCount = countConsecutiveOccupied(row, col, true);
    for (const len of VALID_LENGTHS) {
        if (hCount >= len) {
            const startCol = findHorizontalStart(row, col);
            results.push({ startRow: row, startCol, endRow: row, endCol: startCol + len - 1, horizontal: true, length: len, score: len });
        }
    }
    const vCount = countConsecutiveOccupied(row, col, false);
    for (const len of VALID_LENGTHS) {
        if (vCount >= len) {
            const startRow = findVerticalStart(row, col);
            results.push({ startRow, startCol: col, endRow: startRow + len - 1, endCol: col, horizontal: false, length: len, score: len });
        }
    }
    return results;
}

// ---- Process a move ----
function processMove(row, col, player) {
    const result = { valid: false, scored: false, score: 0, redLine: null, gameEnded: false };

    if (!placePiece(row, col, player)) {
        return result;
    }
    result.valid = true;

    const scoredLines = checkAllLines(row, col);

    if (scoredLines.length > 0) {
        let bestLine = scoredLines[0];
        for (const line of scoredLines) {
            if (line.score > bestLine.score) bestLine = line;
        }

        if (player === HUMAN) {
            humanScore += bestLine.score;
        } else {
            aiScore += bestLine.score;
        }

        addRedLine(bestLine.startRow, bestLine.startCol, bestLine.horizontal, bestLine.length);

        result.scored = true;
        result.score = bestLine.score;
        result.redLine = { row: bestLine.startRow, col: bestLine.startCol, horizontal: bestLine.horizontal, length: bestLine.length };

        extraTurn = true;
    } else {
        extraTurn = false;
    }

    if (isBoardFull()) {
        gameOver = true;
        result.gameEnded = true;
    }

    return result;
}

// ---- DEBUG: log processMove results ----
const _origProcessMove = processMove;
processMove = function(row, col, player) {
    const result = _origProcessMove(row, col, player);
    console.log('DEBUG processMove:', row, col, player === HUMAN ? 'HUMAN' : 'AI', 'scored=', result.scored, 'score=', result.score, 'valid=', result.valid);
    return result;
};

// ---- AI (UPDATED: use >= instead of === for proper evaluation) ----
function getAllEmptyCells() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === EMPTY) empty.push([r, c]);
        }
    }
    return empty;
}

/**
 * Evaluate if AI placing here would create a scoring line.
 * Uses >= to correctly count any run of occupied cells.
 */
function evaluateScorePotential(row, col) {
    grid[row][col] = AI;

    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount >= 12) score += 12;
    else if (hCount >= 9) score += 9;
    else if (hCount >= 6) score += 6;
    else if (hCount >= 3) score += 3;

    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount >= 12) score += 12;
    else if (vCount >= 9) score += 9;
    else if (vCount >= 6) score += 6;
    else if (vCount >= 3) score += 3;

    grid[row][col] = EMPTY;
    return score;
}

/**
 * Evaluate if opponent could score by placing here (blocking potential).
 */
function evaluateBlockPotential(row, col) {
    grid[row][col] = HUMAN;

    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount >= 12) score += 12;
    else if (hCount >= 9) score += 9;
    else if (hCount >= 6) score += 6;
    else if (hCount >= 3) score += 3;

    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount >= 12) score += 12;
    else if (vCount >= 9) score += 9;
    else if (vCount >= 6) score += 6;
    else if (vCount >= 3) score += 3;

    grid[row][col] = EMPTY;
    return score;
}

/**
 * Evaluate if placing here extends an existing occupied line.
 */
function evaluateExtensionPotential(row, col) {
    grid[row][col] = AI;

    let score = 0;
    const hCount = countConsecutiveOccupied(row, col, true);
    if (hCount >= 2 && hCount < 3) score += 1;
    else if (hCount >= 3 && hCount < 6) score += 2;
    else if (hCount >= 6 && hCount < 9) score += 3;
    else if (hCount >= 9 && hCount < 12) score += 4;

    const vCount = countConsecutiveOccupied(row, col, false);
    if (vCount >= 2 && vCount < 3) score += 1;
    else if (vCount >= 3 && vCount < 6) score += 2;
    else if (vCount >= 6 && vCount < 9) score += 3;
    else if (vCount >= 9 && vCount < 12) score += 4;

    grid[row][col] = EMPTY;
    return score;
}

function getBestAIMove() {
    const emptyCells = getAllEmptyCells();
    if (emptyCells.length === 0) return null;

    let bestScore = -Infinity;
    let bestMoves = [];

    for (const cell of emptyCells) {
        const row = cell[0], col = cell[1];
        let score = 0;

        score += evaluateScorePotential(row, col) * 100;
        score += evaluateBlockPotential(row, col) * 50;
        score += evaluateExtensionPotential(row, col) * 25;

        const centerDist = Math.abs(row - SIZE / 2) + Math.abs(col - SIZE / 2);
        score += (SIZE - centerDist);

        if (score > bestScore) {
            bestScore = score;
            bestMoves = [[row, col]];
        } else if (score === bestScore) {
            bestMoves.push([row, col]);
        }
    }

    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// ---- Drawing ----
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#dcc8a8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#8a7a6a';
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= SIZE; i++) {
        const x = PAD + i * CELL;
        const y = PAD + i * CELL;
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(PAD + SIZE * CELL, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, PAD + SIZE * CELL);
        ctx.stroke();
    }

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (cell !== EMPTY) {
                const cx = PAD + c * CELL + CELL / 2;
                const cy = PAD + r * CELL + CELL / 2;

                ctx.beginPath();
                ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = cell === HUMAN ? '#2a5db0' : '#c07020';
                ctx.fill();
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 1.0;
                ctx.stroke();
            }
        }
    }

    ctx.strokeStyle = '#dc2020';
    ctx.lineWidth = 2.0;
    for (const line of redLines) {
        if (line.horizontal) {
            const y = PAD + line.row * CELL + CELL / 2;
            const x1 = PAD + line.col * CELL + CELL / 2;
            const x2 = PAD + (line.col + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.stroke();
        } else {
            const x = PAD + line.col * CELL + CELL / 2;
            const y1 = PAD + line.row * CELL + CELL / 2;
            const y2 = PAD + (line.row + line.length - 1) * CELL + CELL / 2;
            ctx.beginPath();
            ctx.moveTo(x, y1);
            ctx.lineTo(x, y2);
            ctx.stroke();
        }
    }
}

function updateUI() {
    humanScoreSpan.textContent = humanScore;
    aiScoreSpan.textContent = aiScore;
    drawBoard();
}

function setStatus(msg) {
    statusBar.textContent = msg;
}

function updateTurnIndicator() {
    if (gameOver) {
        turnIndicator.textContent = '● 游戏结束';
        turnIndicator.style.color = '#888';
        return;
    }
    if (currentPlayer === HUMAN) {
        turnIndicator.textContent = '● 轮到人类 (蓝色)';
        turnIndicator.style.color = '#2a5db0';
    } else {
        turnIndicator.textContent = '● 轮到 AI (橙色)';
        turnIndicator.style.color = '#c07020';
    }
}

// ---- Game flow ----
function handleHumanMove(row, col) {
    if (gameOver) return;
    if (currentPlayer !== HUMAN) return;
    if (aiThinking) return;
    if (!isEmpty(row, col)) return;

    const result = processMove(row, col, HUMAN);
    if (!result.valid) return;

    updateUI();

    if (result.gameEnded) {
        showGameOver();
        return;
    }

    if (result.scored) {
        setStatus('人类得分 +' + result.score + '！获得额外回合！');
        updateTurnIndicator();
    } else {
        setStatus('AI 思考中...');
        currentPlayer = AI;
        updateTurnIndicator();
        startAIMove();
    }
}

function startAIMove() {
    aiThinking = true;
    setTimeout(() => {
        doAIMove();
    }, 300);
}

function doAIMove() {
    if (gameOver) {
        aiThinking = false;
        return;
    }

    const move = getBestAIMove();
    if (!move) {
        aiThinking = false;
        return;
    }

    const row = move[0], col = move[1];
    const result = processMove(row, col, AI);

    updateUI();

    if (result.gameEnded) {
        showGameOver();
        aiThinking = false;
        return;
    }

    if (result.scored) {
        setStatus('AI 得分 +' + result.score + '！AI获得额外回合！');
        updateTurnIndicator();
        setTimeout(() => doAIMove(), 300);
    } else {
        setStatus('轮到人类 (蓝色) — 请点击棋盘下子');
        currentPlayer = HUMAN;
        aiThinking = false;
        updateTurnIndicator();
    }
}

function showGameOver() {
    let message;
    if (humanScore > aiScore) {
        message = '🎉 人类获胜！\n人类: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else if (aiScore > humanScore) {
        message = '🤖 AI 获胜！\n人类: ' + humanScore + ' 分\nAI: ' + aiScore + ' 分';
    } else {
        message = '🤝 平局！\n双方: ' + humanScore + ' 分';
    }
    setStatus('游戏结束！');
    updateTurnIndicator();
    setTimeout(() => {
        alert(message);
    }, 100);
}

function resetGame() {
    aiThinking = false;
    initGrid();
    redLines = [];
    humanScore = 0;
    aiScore = 0;
    currentPlayer = HUMAN;
    gameOver = false;
    extraTurn = false;
    updateUI();
    setStatus('人类先手 (蓝色) — 请点击棋盘下子');
    updateTurnIndicator();
}

// ---- Canvas click handler ----
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const col = Math.floor((mx - PAD) / CELL);
    const row = Math.floor((my - PAD) / CELL);

    if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
    handleHumanMove(row, col);
});

// ---- Reset button ----
document.getElementById('resetBtn').addEventListener('click', resetGame);

// ---- Init ----
initGrid();
updateUI();
updateTurnIndicator();
</script>
</body>
</html>
